comments:
  UndocumentedPublicClass:
    active: true
    # Documenting a nameless companion object would only repeat the documentation of its class.
    ignoreDefaultCompanionObject: true
  UndocumentedPublicFunction:
    active: true
  UndocumentedPublicProperty:
    active: true

complexity:
  LongParameterList:
    # Counting parameters with defaults would push functions towards the builder defaults replace.
    ignoreDefaultParameters: true
  TooManyFunctions:
    # The Android framework dictates the callbacks a service or an activity overrides.
    ignoreOverridden: true

style:
  MagicNumber:
    # Forcing a constant for every literal adds indirection without telling the reader anything.
    active: false
  ReturnCount:
    # A single exit would nest the steps after each outcome, which NestedBlockDepth already limits.
    active: false
  ThrowsCount:
    # Merging the throws to meet a count would lose the message naming the step that failed.
    active: false
